apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  labels:
    app: traffic-generator
spec:
  replicas: 2   # better realism (traffic from multiple nodes)
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
      - name: hey
        image: williamyeh/hey:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting realistic traffic generator..."
          (
            while true; do
              # Random sleep before spike (10–60s)
              sleep $((RANDOM % 50 + 10))

              echo "Traffic spike starting..."

              # Ramp-up → peak → decay pattern
              for c in 5 10 20 30 20 10 5; do
                hey -z 5s -c $c http://nginx-baseline-svc:80/ > /dev/null 2>&1
                hey -z 5s -c $c http://api-baseline-svc:8080/ > /dev/null 2>&1
              done

              echo "Spike finished"
            done
          ) &

          while true; do

            # Edge simulation: quarterly quiet periods (~33% probability, 20-80s silence)
            # This makes normal-class data non-stationary, matching edge burst patterns.
            if [ $((RANDOM % 3)) -eq 0 ]; then
              echo "Quiet period (edge idle window)..."
              sleep $((RANDOM % 60 + 20))
            fi

            # steady normal traffic
            hey -z 30s -q 40 -c 5 http://nginx-baseline-svc:80/ > /dev/null 2>&1 &
            hey -z 30s -q 40 -c 5 http://api-baseline-svc:8080/ > /dev/null 2>&1 &

            wait
          done

