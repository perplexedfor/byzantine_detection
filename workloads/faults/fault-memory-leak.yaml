apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-memory-leak
  labels:
    app: fault-memory-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fault-memory-leak
  template:
    metadata:
      labels:
        app: fault-memory-leak
    spec:
      containers:
      - name: memory-leak
        image: python:3.9-slim
        command:
        - python
        - -c
        - |
          import time
          import signal
          import sys
          
          data = []
          leaked_total = 0
          max_mb = 350
          
          print("Starting memory leak simulation...")
          print(f"Will leak up to {max_mb} MB")
          
          def signal_handler(sig, frame):
              print(f"[!] Stopping memory leak at {leaked_total} MB")
              sys.exit(0)
          
          signal.signal(signal.SIGTERM, signal_handler)
          
          try:
              while leaked_total < max_mb:
                  leak_amount = {{LEAK_RATE}}
                  data.append(' ' * leak_amount * 1024 * 1024)
                  leaked_total += leak_amount
                  print(f"[+] Leaked {leaked_total} MB total")
                  time.sleep(2)  # Slower leak rate
          except MemoryError:
              print(f"[!] Hit memory limit at {leaked_total} MB")
              sys.exit(0)
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "400Mi"  # Capped at 400Mi so OOM killer triggers before node-wide swap thrashing steals CPU/IO
