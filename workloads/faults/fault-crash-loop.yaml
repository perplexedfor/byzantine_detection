apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-crash-loop
  labels:
    app: fault-crash-loop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fault-crash-loop
  template:
    metadata:
      labels:
        app: fault-crash-loop
    spec:
      containers:
      - name: crash-loop
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "0.5"        # 2 replicas × 0.5 = 1.0 vCPU ceiling; preserves Tetragon sidecar headroom
            memory: "256Mi"
        image: crash-loop-stress:latest
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - |
          echo "Crash-loop simulation starting..."
          
          echo "Starting normally, will crash in {{CRASH_INTERVAL}} seconds to simulate a crash loop..."
          # burn some CPU and allocate memory to make the pod show activity
          stress-ng --cpu {{CRASH_WORKERS}} --timeout {{CRASH_INTERVAL-2}}s &
          stress-ng --vm 1 --vm-bytes 50M --timeout {{CRASH_INTERVAL-2}}s &
          sleep {{CRASH_INTERVAL}}
          exit 1 # Crash the container
