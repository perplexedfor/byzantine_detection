apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-network-chaos
  labels:
    app: fault-network-chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fault-network-chaos
  template:
    metadata:
      labels:
        app: fault-network-chaos
    spec:
      containers:
      - name: network-chaos
        image: alpine:latest
        securityContext:
          capabilities:
            add: ["NET_ADMIN"] # Required for tc (traffic control)
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache iproute2 iputils
          # determine the outbound interface dynamically (default route)
          IF=$(ip route | awk '/default/ {print $5; exit}')
          echo "Using interface $IF for chaos injection"
          echo "Simulating {{LOSS}}% packet loss and {{DELAY}}ms delay on $IF..."
          tc qdisc add dev $IF root netem delay {{DELAY}}ms loss {{LOSS}}%
          # also generate some network traffic so the anomaly actually moves bytes
          while true; do
            ping -c5 8.8.8.8 >/dev/null 2>&1
            sleep 2
          done
      resources:
        requests:
          memory: "64Mi"
        limits:
          memory: "128Mi"
