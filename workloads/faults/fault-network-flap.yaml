# fault-network-flap.yaml
# Edge simulation fault: injects delay + packet loss on enp0s8 (the host-only
# inter-node interface) to simulate a degraded edge WAN/backhaul link.
#
# Uses tc netem. Requires NET_ADMIN capability + hostNetwork access.
# The scenario_runner.py will pin this to a specific node and inject {{DURATION}}.
#
# Parameters substituted by scenario_runner.py:
#   {{DURATION}}  — how long to hold the degraded link (e.g. "110s")
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-network-flap
  labels:
    app: fault-network-flap
    role: fault-injection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fault-network-flap
  template:
    metadata:
      labels:
        app: fault-network-flap
        role: fault-injection
    spec:
      # hostNetwork gives the container direct access to the host's
      # network interfaces (enp0s8), required for tc to affect host traffic
      hostNetwork: true

      containers:
      - name: network-flap
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
              - NET_ADMIN   # required for tc/netem
        command:
          - /bin/sh
          - -c
          - |
            echo "Installing iproute2 for tc..."
            apk add --no-cache iproute2 > /dev/null 2>&1

            IFACE="enp0s8"
            DURATION={{DURATION}}

            echo "Applying network degradation on $IFACE for ${DURATION}s..."
            echo "  -> delay: 200ms ±80ms, loss: 15%"

            # Apply: 200ms base delay with 80ms jitter and 15% packet loss
            tc qdisc add dev $IFACE root netem \
              delay 200ms 80ms \
              loss 15% || true

            sleep $DURATION

            echo "Removing network degradation from $IFACE..."
            tc qdisc del dev $IFACE root 2>/dev/null || true
            echo "Network restored."
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
