apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-high-process
  labels:
    app: security-high-process
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-high-process
  template:
    metadata:
      labels:
        app: security-high-process
    spec:
      containers:
      - name: process-spawner
        image: busybox
        command:
        - /bin/sh
        - -c
        - |
          echo "Simulating high volume of process spawning..."
          while true; do
            echo "Spawning {{SPAWN_COUNT}} processes"
            for i in $(seq 1 {{SPAWN_COUNT}}); do
              # Spawn short-lived strange-named processes
              sh -c "sleep 0.1" -a "kthrotld" &
            done
            wait
            # brief CPU burn so pod shows up in metrics
            dd if=/dev/zero of=/dev/null bs=1M count=20 &
            wait
            sleep $((RANDOM%3 + 1))
          done
      resources:
        requests:
          memory: "128Mi"
        limits:
          memory: "256Mi"
