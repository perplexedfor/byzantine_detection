apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-tmp-exec
  labels:
    app: security-tmp-exec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-tmp-exec
  template:
    metadata:
      labels:
        app: security-tmp-exec
    spec:
      containers:
      - name: tmp-exec
        image: security-tmp-exec:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "64Mi"
          limits:
            memory: "256Mi"
        env:
        - name: EXEC_PATH
          value: "{{EXEC_PATH}}"
        - name: EXEC_INTERVAL
          value: "{{EXEC_INTERVAL}}"
