# Disable components you don't need
kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

# Reduce Prometheus footprint
prometheus:
  prometheusSpec:
    # Retention and resources tuned for 4Gi/4CPU nodes
    retention: 4h
    # Keep scrape/evaluation at 10s to match offline training sampling
    # NOTE: matching your model's expected sampling rate (10s) is critical.
    scrapeInterval: 10s
    evaluationInterval: 10s
    replicas: 1

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1.5Gi

# Grafana removed to save resources in the test environment

# Alertmanager light config
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 200Mi

# Node exporter lighter
nodeExporter:
  resources:
    requests:
      memory: 50Mi
    limits:
      memory: 100Mi

# Example metric relabel configs to drop high-cardinality labels.
# Add these to specific `scrape_configs` or provide via `additionalScrapeConfigs`.
# Apply conservatively — prefer targeting individual metrics/labels to avoid
# discarding useful telemetry.
# Example (drop pod/container/instance labels and a noisy metric):
# metric_relabel_configs:
#   - source_labels: [pod, container, instance]
#     regex: .+
#     action: drop
#   - source_labels: [__name__]
#     regex: some_very_verbose_metric_name
#     action: drop
